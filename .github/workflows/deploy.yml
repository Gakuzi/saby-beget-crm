name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main
      - test

permissions:
  contents: read

concurrency:
  group: crm-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'prod' || 'test' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python source
        run: python3 -m py_compile app.py

      - name: Create release archive
        run: tar --exclude='./.git' --exclude='./__pycache__' --exclude='*.db' --exclude='*.sqlite*' -czf /tmp/crm-release-${{ github.sha }}.tgz . && mv /tmp/crm-release-${{ github.sha }}.tgz crm-release-${{ github.sha }}.tgz

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: crm-release-${{ github.sha }}.tgz
          target: /tmp
          overwrite: true

      - name: Deploy and run health check
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_TARGET,GITHUB_SHA
          script_stop: true
          script: |
            set -euo pipefail
            archive="/tmp/crm-release-${GITHUB_SHA}.tgz"
            test -s "$archive"
            sudo -n /usr/local/sbin/crm-deploy "$DEPLOY_TARGET" < "$archive"
            rm -f "$archive"
            sleep 2
            if [ "$DEPLOY_TARGET" = "prod" ]; then
              curl --fail --silent --show-error http://127.0.0.1:3002/healthz
            else
              curl --fail --silent --show-error http://127.0.0.1:3003/healthz
            fi
