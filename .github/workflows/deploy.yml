name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying latest changes to /opt/backup-reports..."
            
            # Переходим в системную директорию проекта
            cd /opt/backup-reports
            
            # Проверяем наличие репозитория
            if [ -d ".git" ]; then
              echo "Updating existing repository..."
              git fetch --all
              git reset --hard origin/main
            else
              echo "Cloning fresh repository..."
              # Очищаем папку если она не пуста, но нет .git
              rm -rf * 
              git clone https://github.com/${{ github.repository }} .
            fi
            
            # Установка зависимостей
            if [ -f "requirements.txt" ]; then
              echo "Installing Python dependencies..."
              pip3 install -r requirements.txt --user
            fi
            
            # Перезапуск сервиса
            echo "Restarting CRM service..."
            sudo systemctl restart crm
            
            echo "Deployment completed successfully!"
