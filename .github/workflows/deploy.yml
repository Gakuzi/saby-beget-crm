name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying latest changes to /opt/backup-reports..."
            cd /opt/backup-reports
            
            mkdir -p /root/.ssh
            ssh-keyscan -H github.com >> /root/.ssh/known_hosts 2>/dev/null || true
            if [ -d ".git" ]; then
              git fetch --all
              git reset --hard origin/main
            fi
            
            # Перезапуск сервиса CRM
            pkill -f "/opt/backup-reports/app.py" || true
            nohup /usr/bin/python3 /opt/backup-reports/app.py > /opt/backup-reports/app.log 2>&1 &
            echo "Deployment completed successfully!"