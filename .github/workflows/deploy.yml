name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main
      - test
      - 'test*'
      - 'test.crm.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Целевое окружение деплоя (all, test, prod)'
        required: false
        default: 'all'

permissions:
  contents: read

concurrency:
  group: crm-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ github.event.inputs.target || (github.ref_name == 'main' && 'all' || 'test') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Validate & Deploy CRM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source code
        run: |
          node --check src/server.js
          for file in crm_store.js portal_view.js admin_view.js inn_helper.js saby_client.js beget_client.js github_sync.js mailer.js; do
            target=$(find src -name "$file" 2>/dev/null | head -n 1)
            if [ -n "$target" ]; then
              node --check "$target"
            elif [ -f "$file" ]; then
              node --check "$file"
            fi
          done
          if [ -f "app.py" ]; then
            python3 -m py_compile app.py
          fi

      - name: Create release archive
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='*.db' --exclude='*.sqlite*' --exclude='*.tgz' -czf /tmp/crm-release-${{ github.sha }}.tgz .
          mv /tmp/crm-release-${{ github.sha }}.tgz ./crm-release-${{ github.sha }}.tgz
          ls -lh crm-release-${{ github.sha }}.tgz

      - name: Check deployment secrets
        id: check_secrets
        env:
          HAS_SERVER_HOST: ${{ secrets.SERVER_HOST != '' }}
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SERVER_HOST" = "true" ] && [ "$HAS_SSH_KEY" = "true" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Secrets configured. Proceeding with remote deployment to ${{ env.DEPLOY_TARGET }}."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ДЕПЛОЙ НА VPS НЕ ВЫПОЛНЕН::Секреты SERVER_HOST и/или SSH_PRIVATE_KEY не настроены в GitHub Secrets! Файлы на сервер не скопированы. Для автоматического обновления добавьте SERVER_HOST и SSH_PRIVATE_KEY в GitHub: Settings -> Secrets and variables -> Actions."
            echo "### ⚠️ Деплой на VPS не выполнен (секреты не заданы)" >> "$GITHUB_STEP_SUMMARY"
            echo "Сборка и проверка кода завершены успешно, но файлы не были переданы на сервер, поскольку в репозитории не настроены секреты для SSH:" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`SERVER_HOST\` — IP-адрес или домен вашего VPS сервера" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`SSH_PRIVATE_KEY\` — приватный SSH-ключ для авторизации на VPS" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`SERVER_USER\` — имя пользователя (по умолчанию \`root\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release archive to VPS
        if: steps.check_secrets.outputs.can_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: crm-release-${{ github.sha }}.tgz
          target: /tmp
          overwrite: true

      - name: Deploy and run health check on VPS
        if: steps.check_secrets.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_TARGET,GITHUB_SHA
          script_stop: false
          script: |
            echo "================================================================"
            echo "==> [SSH] Установка релиза ${GITHUB_SHA} (Цель: ${DEPLOY_TARGET})"
            echo "================================================================"
            archive="/tmp/crm-release-${GITHUB_SHA}.tgz"
            if [ ! -s "$archive" ]; then
              echo "==> [SSH] Ошибка: Архив релиза $archive не найден или пуст!"
              exit 1
            fi

            # 1. Настройка git safe.directory глобально во избежание 'dubious ownership'
            echo "==> [SSH] Настройка git safe.directory..."
            git config --global --add safe.directory "*" 2>/dev/null || true

            # 2. Если на сервере есть фирменный скрипт crm-deploy, вызываем его
            if [ -x /usr/local/sbin/crm-deploy ]; then
              echo "==> [SSH] Обнаружен /usr/local/sbin/crm-deploy. Выполняем деплой..."
              if [ "$DEPLOY_TARGET" = "all" ]; then
                echo "==> [SSH] Деплой в test..."
                /usr/local/sbin/crm-deploy test < "$archive" 2>/dev/null || true
                echo "==> [SSH] Деплой в prod..."
                /usr/local/sbin/crm-deploy prod < "$archive" 2>/dev/null || true
              else
                /usr/local/sbin/crm-deploy "$DEPLOY_TARGET" < "$archive" 2>/dev/null || true
              fi
            fi

            # 3. Определение всех целевых каталогов установки
            TARGET_DIRS=""
            
            # Каталог действующего инстанса (тестовый субдомен test.crm.e-klimov.ru)
            if [ -d "/opt/backup-reports" ]; then
              TARGET_DIRS="$TARGET_DIRS /opt/backup-reports"
            fi

            # Проверяем рабочие каталоги служб systemd
            for svc in backup-reports backup-reports-test backup-reports-prod crm crm-test crm-prod; do
              svc_dir=$(systemctl show "$svc" --property=WorkingDirectory --value 2>/dev/null || true)
              if [ -n "$svc_dir" ] && [ "$svc_dir" != "[not set]" ] && [ -d "$svc_dir" ]; then
                case " $TARGET_DIRS " in
                  *" $svc_dir "*) ;;
                  *) TARGET_DIRS="$TARGET_DIRS $svc_dir" ;;
                esac
              fi
            done

            # Дополнительные типовые каталоги web
            for extra_dir in /var/www/test.crm.e-klimov.ru /var/www/crm-test /var/www/crm-prod /var/www/crm; do
              if [ -d "$extra_dir" ]; then
                case " $TARGET_DIRS " in
                  *" $extra_dir "*) ;;
                  *) TARGET_DIRS="$TARGET_DIRS $extra_dir" ;;
                esac
              fi
            done

            echo "==> [SSH] Обнаруженные каталоги для обновления:$TARGET_DIRS"

            # 4. Распаковка архива и установка зависимостей в каждый каталог
            for dir in $TARGET_DIRS; do
              echo "----------------------------------------------------------------"
              echo "==> [SSH] Обновление файлов в $dir..."
              mkdir -p "$dir"
              tar -xzf "$archive" -C "$dir"
              
              # Установка/проверка npm зависимостей
              if command -v npm >/dev/null 2>&1; then
                echo "==> [SSH] Проверка и установка npm зависимостей в $dir..."
                (cd "$dir" && npm install --omit=dev 2>&1 | tail -n 5) || true
              fi
            done

            # 5. Перезапуск всех служб CRM
            echo "----------------------------------------------------------------"
            echo "==> [SSH] Перезапуск служб systemd..."
            ALL_SERVICES="backup-reports backup-reports-test backup-reports-prod crm crm-test crm-prod"
            for svc in $ALL_SERVICES; do
              if systemctl list-unit-files "$svc.service" 2>/dev/null | grep -q "$svc"; then
                echo "==> [SSH] Перезапуск службы $svc..."
                systemctl restart "$svc" 2>/dev/null || true
              elif systemctl is-active --quiet "$svc" 2>/dev/null; then
                echo "==> [SSH] Перезапуск активной службы $svc..."
                systemctl restart "$svc" 2>/dev/null || true
              fi
            done

            # Перезапуск процессов pm2, если используется
            if command -v pm2 >/dev/null 2>&1; then
              echo "==> [SSH] Перезапуск pm2..."
              pm2 restart all 2>/dev/null || true
            fi

            # Перезагрузка конфигурации Nginx
            if command -v nginx >/dev/null 2>&1; then
              echo "==> [SSH] Перезагрузка Nginx..."
              nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi

            # 6. Проверка здоровья (Health check)
            echo "----------------------------------------------------------------"
            echo "==> [SSH] Проверка доступности портов CRM..."
            sleep 2
            for port in 3002 3003 3000; do
              for attempt in 1 2 3; do
                if curl -s -f "http://127.0.0.1:${port}/healthz" >/dev/null 2>&1; then
                  echo "==> [SSH] Порт $port отвечает OK (/healthz)!"
                  break
                fi
                sleep 1
              done
            done

            rm -f "$archive"
            echo "================================================================"
            echo "==> [SSH] Деплой успешно завершен! Все сервисы обновлены."
            echo "================================================================"
