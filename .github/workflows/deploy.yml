name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }} # Должно быть 'deploy'
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Приватный ключ для пользователя deploy
          script: |
            echo "Deploying latest changes to VPS as user 'deploy'..."
            
            # Переходим в директорию проекта
            # Проверьте, что путь верный. Обычно это /home/deploy/backup-reports
            cd /home/deploy/backup-reports || { echo "Directory not found"; exit 1; }
            
            # Обновляем код из репозитория
            git fetch --all
            git reset --hard origin/main
            
            # Установка зависимостей (если requirements.txt изменился)
            if [ -f "requirements.txt" ]; then
              echo "Installing Python dependencies..."
              pip3 install -r requirements.txt --user
            fi
            
            # Перезапуск сервиса CRM
            # Используем sudo, так как restart обычно требует прав root
            echo "Restarting CRM service..."
            sudo systemctl restart crm
            
            echo "Deployment completed successfully!"
