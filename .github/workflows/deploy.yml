name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main
      - test

permissions:
  contents: read

concurrency:
  group: crm-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Node.js source
        run: |
          node --check server.js
          node --check crm_store.js
          node --check portal_view.js
          node --check admin_view.js
          node --check inn_helper.js

      - name: Create release archive
        run: tar --exclude='./.git' --exclude='./node_modules' --exclude='*.db' --exclude='*.sqlite*' -czf /tmp/crm-release-${{ github.sha }}.tgz . && mv /tmp/crm-release-${{ github.sha }}.tgz crm-release-${{ github.sha }}.tgz

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: crm-release-${{ github.sha }}.tgz
          target: /tmp
          overwrite: true

      - name: Deploy and run health check
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_TARGET,GITHUB_SHA
          script_stop: true
          script: |
            set -euo pipefail
            archive="/tmp/crm-release-${GITHUB_SHA}.tgz"
            test -s "$archive"
            sudo -n /usr/local/sbin/crm-deploy "$DEPLOY_TARGET" < "$archive"
            rm -f "$archive"
            echo "Remote deploy and built-in service health check completed for $DEPLOY_TARGET"
