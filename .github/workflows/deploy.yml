name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Start deployment to /opt/backup-reports..."
            
            cd /opt/backup-reports
            
            if [ -d ".git" ]; then
              echo "📦 Updating existing repository..."
              git fetch --all
              git reset --hard origin/main
              git clean -fd
            else
              echo "❌ Error: Not a git repository. Please initialize manually."
              exit 1
            fi
            
            echo "📦 Installing dependencies..."
            pip3 install -r requirements.txt --user --quiet
            
            echo "🔄 Restarting CRM service..."
            sudo systemctl restart crm
            
            echo "✅ Deployment completed successfully!"
