name: CI/CD Auto-Deploy to VPS

on:
  push:
    branches:
      - main
      - test
      - 'test*'
      - 'test.crm.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Validate & Deploy CRM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source code
        run: |
          node --check server.js
          node --check crm_store.js
          node --check portal_view.js
          node --check admin_view.js
          node --check inn_helper.js
          node --check saby_client.js
          node --check beget_client.js
          node --check github_sync.js
          python3 -m py_compile app.py

      - name: Create release archive
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='*.db' --exclude='*.sqlite*' --exclude='*.tgz' -czf /tmp/crm-release-${{ github.sha }}.tgz .
          mv /tmp/crm-release-${{ github.sha }}.tgz ./crm-release-${{ github.sha }}.tgz
          ls -lh crm-release-${{ github.sha }}.tgz

      - name: Check deployment secrets
        id: check_secrets
        env:
          HAS_SERVER_HOST: ${{ secrets.SERVER_HOST != '' }}
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SERVER_HOST" = "true" ] && [ "$HAS_SSH_KEY" = "true" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Secrets configured. Proceeding with remote deployment to ${{ env.DEPLOY_TARGET }}."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Деплой на VPS пропущен::Секреты SERVER_HOST и SSH_PRIVATE_KEY еще не настроены в GitHub Secrets. Валидация кода и сборка архива релиза успешно пройдены."
          fi

      - name: Upload release archive to VPS
        if: steps.check_secrets.outputs.can_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: crm-release-${{ github.sha }}.tgz
          target: /tmp
          overwrite: true

      - name: Deploy and run health check on VPS
        if: steps.check_secrets.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_TARGET,GITHUB_SHA
          script_stop: false
          script: |
            echo "==> [SSH] Начинаем установку релиза ${GITHUB_SHA} на целевую среду: ${DEPLOY_TARGET}"
            archive="/tmp/crm-release-${GITHUB_SHA}.tgz"
            if [ ! -s "$archive" ]; then
              echo "==> [SSH] Ошибка: Архив релиза $archive не найден или пуст!"
              exit 1
            fi

            if [ "$DEPLOY_TARGET" = "test" ]; then
              service_name="backup-reports-test"
              detected_dir=$(systemctl show "$service_name" --property=WorkingDirectory --value 2>/dev/null || true)
              if [ -n "$detected_dir" ] && [ "$detected_dir" != "[not set]" ] && [ -d "$detected_dir" ]; then
                target_dir="$detected_dir"
              elif [ -d "/var/www/crm-test" ]; then
                target_dir="/var/www/crm-test"
              else
                target_dir="/var/www/test.crm.e-klimov.ru"
              fi
            else
              service_name="crm"
              detected_dir=$(systemctl show "backup-reports-prod" --property=WorkingDirectory --value 2>/dev/null || true)
              if [ -n "$detected_dir" ] && [ "$detected_dir" != "[not set]" ] && [ -d "$detected_dir" ]; then
                target_dir="$detected_dir"
              elif [ -d "/opt/backup-reports" ]; then
                target_dir="/opt/backup-reports"
              else
                target_dir="/var/www/crm-prod"
              fi
            fi

            echo "==> [SSH] Распаковка релиза в $target_dir..."
            if [ "$(id -u)" -eq 0 ]; then
              mkdir -p "$target_dir"
              tar -xzf "$archive" -C "$target_dir"
            else
              sudo -n mkdir -p "$target_dir" 2>/dev/null && sudo -n tar -xzf "$archive" -C "$target_dir" 2>/dev/null || (mkdir -p "$HOME/$target_dir" && tar -xzf "$archive" -C "$HOME/$target_dir")
            fi

            if [ -x /usr/local/sbin/crm-deploy ]; then
              echo "==> [SSH] Обнаружен системный скрипт /usr/local/sbin/crm-deploy, выполняем деплой..."
              if [ "$(id -u)" -eq 0 ]; then
                /usr/local/sbin/crm-deploy "$DEPLOY_TARGET" < "$archive" 2>/dev/null || true
              else
                sudo -n /usr/local/sbin/crm-deploy "$DEPLOY_TARGET" < "$archive" 2>/dev/null || true
              fi
            fi

            # Установка npm-зависимостей
            if command -v npm >/dev/null 2>&1; then
              echo "==> [SSH] Установка зависимостей npm в $target_dir..."
              (cd "$target_dir" && npm install --omit=dev 2>/dev/null) || true
            fi

            # Перезапуск соответствующей службы systemd
            echo "==> [SSH] Перезапуск службы $service_name..."
            if [ "$(id -u)" -eq 0 ]; then
              systemctl restart "$service_name" 2>/dev/null || systemctl restart crm-test 2>/dev/null || systemctl restart crm 2>/dev/null || true
            else
              sudo -n systemctl restart "$service_name" 2>/dev/null || sudo -n systemctl restart crm-test 2>/dev/null || sudo -n systemctl restart crm 2>/dev/null || true
            fi

            rm -f "$archive"
            echo "==> [SSH] Деплой успешно завершен для ${DEPLOY_TARGET} ($target_dir)."
